[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "warntext"
dynamic = ["version"]
description = "A research corpus of the public emergency alert messages sent in the United States"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Obada Kraishan" }]
keywords = [
    "emergency-alerts",
    "wireless-emergency-alerts",
    "crisis-communication",
    "risk-communication",
    "communication-research",
    "dataset",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Sociology",
]
dependencies = [
    "defusedxml>=0.7.1",
    "pydantic>=2.6",
    "requests>=2.31",
]

[project.scripts]
warntext = "warntext.cli:main"

[project.urls]
Repository = "https://github.com/obadaKraishan/warntext"
Issues = "https://github.com/obadaKraishan/warntext/issues"
Changelog = "https://github.com/obadaKraishan/warntext/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/warntext/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/warntext"]

# The sdist carries the code and the tests; never data.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["warntext"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
